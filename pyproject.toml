[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indtrader"
version = "0.1.0"
description = "Personal non-intraday trading & investing platform for Indian equities (NSE/BSE). Daily/weekly only: signals on closed bars, executed next morning, CNC delivery."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",  # 3.x wheels ship unsigned .pyd files — blocked by Smart App Control
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# NSE as primary data source (GPL library kept as an arm's-length dependency):
nse = ["NseIndiaApi>=5"]
# Chrome-impersonation transport for news/calendar — the ONLY transport that
# clears the laptop-network WAF (round-5: plain urllib got 403 there, curl_cffi
# returned 100 items). The Docker image installs this so a container behaves
# like the laptop, not like a datacenter box with silently-dead feeds.
web = ["curl-cffi>=0.7"]
# HRP portfolio weights; when the lib-vs-scipy combo is broken, weights auto-fall
# back to inverse_vol with a loud message (see docs/HOME-VALIDATION.md item 6):
opt = ["PyPortfolioOpt>=1.5.5"]

[project.scripts]
indtrader = "indtrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
